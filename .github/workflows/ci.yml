name: ci.yml
on: [push]

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format
      - name: Check formatting
        run: find src tests -name '*.cpp' -o -name '*.h' | xargs clang-format --dry-run --Werror

  docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install doxygen
        run: sudo apt-get update && sudo apt-get install -y doxygen
      - name: Configure
        run: cmake -S . -B build
      - name: Docs
        run: cmake --build build --target doc_doxygen

  tidy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install tooling
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: clang-tidy libvtk9-dev
          version: 1.0
      - name: Configure
        run: cmake -S . -B build -DENABLE_VTK_OUTPUT=ON -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      - name: clang-tidy
        run: run-clang-tidy -p build -quiet -warnings-as-errors='*' "$PWD/src/" "$PWD/tests/"

  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install tooling
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: libvtk9-dev
          version: 1.0
      - name: Configure
        run: cmake -S . -B build -DENABLE_VTK_OUTPUT=ON
      - name: Build
        run: cmake --build build -j
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Example run
        run: ./build/MolSim input/eingabe-sonne.txt --end 1 --dt 1
